name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Check code formatting
      run: |
        npm install --save-dev prettier
        npx prettier --check "src/**/*.{js,vue,scss}"
      continue-on-error: true
    
    - name: Run ESLint
      run: npm run lint
      continue-on-error: true
    
    - name: Comment PR
      uses: actions/github-script@v6
      if: always()
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const output = `
          ### 🔍 Pull Request Check Results
          
          - ✅ Code checkout successful
          - ✅ Dependencies installed
          - ⚠️ Code formatting check (non-blocking)
          - ⚠️ ESLint check (non-blocking)
          
          > This is an automated check. Please review any warnings above.
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: output
          })