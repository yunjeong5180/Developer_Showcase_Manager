# Netlify 배포 설정

[build]
  # 빌드 명령
  command = "npm run build:railway"
  
  # 빌드 결과물 디렉토리
  publish = "dist"
  
  # Node.js 버전 지정
  environment = { NODE_VERSION = "18.19.1" }

# SPA 라우팅을 위한 리다이렉트 설정
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 헤더 설정
[[headers]]
  for = "/*"
  
  [headers.values]
    # 보안 헤더
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # 캐싱 헤더 (정적 자산)
    Cache-Control = '''
      public,
      max-age=31536000,
      immutable
    '''

[[headers]]
  for = "/index.html"
  
  [headers.values]
    # HTML은 캐싱하지 않음
    Cache-Control = '''
      no-cache,
      no-store,
      must-revalidate
    '''

# 환경 변수 (예시)
[build.environment]
  VUE_APP_API_URL = "https://api.example.com"
  
# 배포 미리보기 설정
[context.deploy-preview]
  command = "npm run build:railway"
  
# 브랜치 배포 설정
[context.branch-deploy]
  command = "npm run build:railway"
  
# 프로덕션 배포 설정
[context.production]
  command = "npm run build:railway"
  
  [context.production.environment]
    NODE_ENV = "production"